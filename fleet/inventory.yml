# Fleet inventory — source of truth for the runner health monitor.
# No secrets / no IPs (host addresses live in GitHub secrets via ssh_secret_prefix).
# Keep current as runners are registered / removed.
#
# Each host's ssh_secret_prefix selects the secret set the monitor/restart use:
#   <PREFIX>_VPS_HOST / <PREFIX>_VPS_USERNAME / <PREFIX>_VPS_SSH_KEY
# and each host's id selects its pinned SSH host key in fleet/known_hosts (OPS-33):
# a host with no pinned key is never connected to.

hosts:
  - id: ovh-staging            # OVH "DevOps_Server_002" (vps-8832134f), CI box 1.
    ssh_secret_prefix: DEVOPS
    disk_threshold: 85

  - id: ovh-devops-001         # OVH vps-f8fe5d07 (CI box 2). Despite its old
    ssh_secret_prefix: DEVOPS001  # "WebHosting_Server_001" name it serves no web
    disk_threshold: 85            # traffic: weaponslore.com's DNS doesn't point at it
                                  # (OPS-28 poll).

  - id: hosting-vps            # OVH vps-e0eef96f, the staging web host (weaponslore.com).
    ssh_secret_prefix: HOSTING # Web only: no runners are ever placed here (OPS-17).
    disk_threshold: 85

# Extra repos queue-watchdog.yml scans for stuck jobs, beyond the repos implied by
# runners[] (repo targets + every repo of an org target). Their runners are not
# tracked here.
watch_repos:
  - ResearchMonkey/Codex_of_things

# Domains fleet-inventory.yml resolves and maps to the host whose IPs match.
domains:
  - weaponslore.com

runners:
  - name: org-runner-02
    host: ovh-devops-001
    scope: org
    target: Echo8Lore
    labels: [self-hosted, Linux, X64]
    systemd_unit: actions.runner.Echo8Lore.org-runner-02.service

  - name: vps-ci-runner-01     # Weapons_Lore repo runner; ci-gate.yml asks only for
    host: ovh-staging          # `self-hosted`, so it and org-runner-02 both serve it.
    scope: repo
    target: Echo8Lore/Weapons_Lore
    labels: [self-hosted, Linux, X64, vps, ci-runner, wl]
    systemd_unit: actions.runner.Echo8Lore-Weapons_Lore.vps-ci-runner-01.service

  - name: wh40k-runner-01
    host: ovh-staging
    scope: repo
    target: ResearchMonkey/warhammer-40k-database
    labels: [self-hosted, Linux, X64, vps, ci-runner, warhammer]
    systemd_unit: actions.runner.ResearchMonkey-warhammer-40k-database.wh40k-runner-01.service

  - name: personal-fieldkit-01
    host: ovh-staging
    scope: repo
    target: ResearchMonkey/FieldKit
    labels: [self-hosted, Linux, X64, fieldkit]
    systemd_unit: actions.runner.ResearchMonkey-FieldKit.personal-fieldkit-01.service

  - name: personal-fieldkit-02
    host: ovh-devops-001
    scope: repo
    target: ResearchMonkey/FieldKit
    labels: [self-hosted, Linux, X64, fieldkit]
    systemd_unit: actions.runner.ResearchMonkey-FieldKit.personal-fieldkit-02.service

  - name: wh40k-runner-02
    host: ovh-devops-001
    scope: repo
    target: ResearchMonkey/warhammer-40k-database
    labels: [self-hosted, Linux, X64, vps, ci-runner, warhammer]
    systemd_unit: actions.runner.ResearchMonkey-warhammer-40k-database.wh40k-runner-02.service
