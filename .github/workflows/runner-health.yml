name: Runner Health Monitor

# Monitors the WHOLE fleet across every scope listed in fleet/inventory.yml — runner
# liveness (org + per-repo), host disk space, and stale in-progress jobs. Sends tiered
# Telegram alerts (Hermes's bot, via ops/notify-telegram.sh) and auto-restarts offline
# runners by their systemd unit.
#
# Generalized from Weapons_Lore runner-health.yml (WEAP-396/464): the per-runner API
# iteration is unchanged; the single repo scope is replaced by an inventory-driven loop
# over org + repo scopes, and the hardcoded DevOpsRunner001 restart special-case is
# replaced by a matrix derived from the inventory.
#
# Required secrets:
#   - RUNNER_HEALTH_PAT  (admin scope on the org + personal repos — runner API)
#   - <PREFIX>_VPS_HOST / _VPS_USERNAME / _VPS_SSH_KEY per host, where PREFIX is the
#     host's ssh_secret_prefix in fleet/inventory.yml  (disk check + restart)
#   - TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID  (alerts; if either is empty the monitor
#     still runs and warns that it cannot alert)
#
# Host keys: every SSH call verifies the host's key pinned in fleet/known_hosts (OPS-33);
# a mismatch fails that leg with HOST KEY VERIFICATION FAILED. No secret involved.
#
# Prove the alert path end to end without an outage: Run workflow with test_alert
# checked. It sends one "[test]" message even when the fleet is healthy, and FAILS the
# alert job if Telegram does not accept it.
#
# CADENCE (OPS-23). The cron below DECLARES hourly, but GitHub throttles sub-daily cron
# to ~6 runs/day: on cron alone this monitor runs roughly every 4-5 h. The real trigger
# is workflow_dispatch from the fleet-dispatch timers on both CI boxes
# (ops/fleet-dispatch.sh, ops/systemd/): slot a (ovh-staging) at :00, slot b
# (ovh-devops-001) at :30 -> every 30 min with both boxes, hourly with one, and back to
# the throttled cron (~6/day) with none. The cron stays as that backstop. The job itself
# runs on a GitHub-hosted runner, so it never depends on a host it monitors.
#
# check-scheduler watches the timers: it counts this workflow's and queue-watchdog's
# recent workflow_dispatch runs per slot (ops/dispatch_liveness.py) and adds "scheduler
# degraded: dispatch timers not firing" (both slots silent) or a half-rate NOTICE (one
# slot silent) to the alert. It runs only when the repo variable FLEET_DISPATCH_ENABLED
# is 'true', set after the timers are installed (docs/RUNBOOK.md), so it cannot
# false-alarm before then.

on:
  schedule:
    - cron: '0 * * * *'   # declared hourly, throttled to ~6/day: backstop only (CADENCE)
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Also send a "[test]" Telegram message to prove the alert path'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  # ── Hosts list for the per-host disk check ───────────────────────────────
  load-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v5
      - name: Read hosts
        id: hosts
        run: echo "hosts=$(yq -o=json -I=0 '.hosts' fleet/inventory.yml)" >> "$GITHUB_OUTPUT"

  # ── Discover scopes + check liveness across all of them ──────────────────
  check-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any_offline: ${{ steps.check.outputs.any_offline }}
      offline_runners: ${{ steps.check.outputs.offline_runners }}
      offline_detail: ${{ steps.check.outputs.offline_detail }}
    steps:
      - uses: actions/checkout@v5

      - name: Check all runners across inventory scopes
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::No RUNNER_HEALTH_PAT configured."
            { echo 'any_offline=false'; echo 'offline_runners=[]'; echo 'offline_detail=[]'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Inventory -> JSON (yq is preinstalled on ubuntu-latest).
          INV=$(yq -o=json '.' fleet/inventory.yml)

          # Distinct scopes to query, derived from the runners list.
          SCOPES=$(echo "$INV" | jq -c '[.runners[] | {scope, target}] | unique')
          echo "Scopes: $SCOPES"

          ALL='[]'   # accumulated [{name,status,scope,target}]
          for row in $(echo "$SCOPES" | jq -c '.[]'); do
            SCOPE=$(echo "$row" | jq -r '.scope')
            TARGET=$(echo "$row" | jq -r '.target')
            if [ "$SCOPE" = "org" ]; then
              API="orgs/${TARGET}/actions/runners"
            else
              API="repos/${TARGET}/actions/runners"
            fi
            RESP=$(gh api --paginate "$API" 2>/tmp/api-err || true)
            if [ -z "$RESP" ]; then
              echo "::warning::Could not query $API ($(cat /tmp/api-err 2>/dev/null | head -1))"
              continue
            fi
            ROWS=$(echo "$RESP" | jq -c --arg s "$SCOPE" --arg t "$TARGET" \
              '[.runners[] | {name, status, os, busy, scope:$s, target:$t}]')
            ALL=$(jq -c -n --argjson a "$ALL" --argjson b "$ROWS" '$a + $b')
          done

          echo "=== Fleet runner status ==="
          echo "$ALL" | jq -r '.[] | "  \(.name) [\(.scope):\(.target)]: \(.status)"'

          OFFLINE_NAMES=$(echo "$ALL" | jq -c '[.[] | select(.status != "online") | .name]')
          ANY=$(echo "$OFFLINE_NAMES" | jq 'length > 0')

          # Join offline runners to their systemd_unit + host secret prefix for restart.
          DETAIL=$(echo "$INV" | jq -c --argjson off "$OFFLINE_NAMES" \
            '(.hosts | map({(.id): .ssh_secret_prefix}) | add) as $pfx
             | [.runners[] | select(.name as $n | $off | index($n))
                | {name, unit: .systemd_unit, prefix: $pfx[.host],
                   api: (if .scope == "org" then "orgs/\(.target)/actions/runners"
                         else "repos/\(.target)/actions/runners" end)}]')

          {
            echo "any_offline=${ANY}"
            echo "offline_runners=${OFFLINE_NAMES}"
            echo "offline_detail=${DETAIL}"
          } >> "$GITHUB_OUTPUT"

          if [ "$ANY" = "true" ]; then
            echo "::error::Offline runner(s): $(echo "$OFFLINE_NAMES" | jq -r 'join(", ")')"
          fi

  # ── Host disk check (every inventory host) ───────────────────────────────
  # A failing leg (disk over threshold, SSH unreachable, or a host key that does not
  # match fleet/known_hosts) fails this job; the alert job reads
  # needs.check-disk.result.
  #
  # Plain ssh with the pinned host key (fleet/pinned-ssh.sh, OPS-33) rather than
  # appleboy/ssh-action: that action's `fingerprint` input takes one SHA256 per host
  # and drone-ssh (Go) picks the host key algorithm itself, so the pin would sit apart
  # from fleet/known_hosts and could drift from it. ssh's stderr is not printed (see
  # fleet/pinned-ssh.sh); only the exit code and a host-key verdict are.
  check-disk:
    needs: load-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.load-inventory.outputs.hosts) }}
    name: check-disk (${{ matrix.host.id }})
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: fleet

      - name: Check ${{ matrix.host.id }} disk
        env:
          HOST_ID: ${{ matrix.host.id }}
          THRESHOLD: ${{ matrix.host.disk_threshold || 85 }}
          SSH_HOST: ${{ secrets[format('{0}_VPS_HOST', matrix.host.ssh_secret_prefix)] }}
          SSH_USER: ${{ secrets[format('{0}_VPS_USERNAME', matrix.host.ssh_secret_prefix)] }}
          SSH_KEY: ${{ secrets[format('{0}_VPS_SSH_KEY', matrix.host.ssh_secret_prefix)] }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::${HOST_ID}: SSH secrets not configured"; exit 1
          fi
          source fleet/pinned-ssh.sh
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          pinned_ssh_opts "$HOST_ID" "$RUNNER_TEMP/key"
          rc=0
          USAGE=$(ssh "${PINNED_SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
                    "df / | awk 'NR==2 {print \$5}' | tr -d '%'" 2> "$RUNNER_TEMP/ssh.err") || rc=$?
          krc=0
          pinned_ssh_check "$HOST_ID" "$rc" "$RUNNER_TEMP/ssh.err" || krc=$?
          [ "$krc" -eq 2 ] && exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::${HOST_ID}: SSH failed (exit ${rc})"; exit 1
          fi
          case "$USAGE" in
            ''|*[!0-9]*) echo "::error::${HOST_ID}: could not read disk usage"; exit 1 ;;
          esac
          echo "Host disk: ${USAGE}% (threshold ${THRESHOLD}%)"
          if [ "$USAGE" -ge "$THRESHOLD" ]; then echo "THRESHOLD_EXCEEDED"; exit 1; fi

  # ── Stale in-progress jobs (>60 min) across known repos ──────────────────
  check-stale-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale_count: ${{ steps.check.outputs.stale_count }}
      stale_summary: ${{ steps.check.outputs.stale_summary }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect stale runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            { echo 'stale_count=0'; echo 'stale_summary='; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          INV=$(yq -o=json '.' fleet/inventory.yml)
          OWNER='${{ github.repository_owner }}'

          # Repos to inspect: explicit repo-scope targets + all repos in any org scope.
          REPOS=$(echo "$INV" | jq -r '[.runners[] | select(.scope=="repo") | .target] | unique[]')
          ORGS=$(echo "$INV" | jq -r '[.runners[] | select(.scope=="org") | .target] | unique[]')
          for org in $ORGS; do
            MORE=$(gh api --paginate "orgs/${org}/repos" --jq '.[].full_name' 2>/dev/null || true)
            REPOS=$(printf "%s\n%s" "$REPOS" "$MORE")
          done
          REPOS=$(echo "$REPOS" | sort -u | sed '/^$/d')

          THRESHOLD=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          STALE='[]'
          for repo in $REPOS; do
            RAW=$(mktemp)
            if gh api "repos/${repo}/actions/runs?status=in_progress&per_page=100" > "$RAW" 2>/dev/null; then
              ITEMS=$(jq -c --arg th "$THRESHOLD" --arg r "$repo" \
                '[.workflow_runs[] | select(.created_at < $th) | {repo:$r, name, created_at, html_url}]' "$RAW" 2>/dev/null || echo '[]')
              STALE=$(jq -c -n --argjson a "$STALE" --argjson b "$ITEMS" '$a + $b')
            fi
            rm -f "$RAW"
          done

          COUNT=$(echo "$STALE" | jq 'length')
          echo "stale_count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            SUMMARY=$(echo "$STALE" | jq -r '[.[0:5][] | "  - \(.repo): \(.name) — started \(.created_at)"] | join("\\n")')
            echo "stale_summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
            echo "::warning::${COUNT} stale run(s) >60min"
          else
            echo "stale_summary=" >> "$GITHUB_OUTPUT"
          fi

  # ── Are the fleet-dispatch timers still firing? (OPS-23) ─────────────────
  # Off until the operator sets vars.FLEET_DISPATCH_ENABLED=true after installing the
  # timers on the CI boxes. GITHUB_TOKEN (actions: write above includes read) is enough
  # to list this repo's runs. Never fails the run: an API error only warns.
  check-scheduler:
    if: vars.FLEET_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      message: ${{ steps.check.outputs.message }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ops
      - name: Count recent dispatch runs per slot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ops/dispatch_liveness.py check \
            --schedule ops/systemd/fleet-dispatch.schedule \
            --repo "$GITHUB_REPOSITORY" --message "$RUNNER_TEMP/scheduler.txt"
          {
            echo 'message<<SCHEDULER_EOF'
            cat "$RUNNER_TEMP/scheduler.txt"
            echo 'SCHEDULER_EOF'
          } >> "$GITHUB_OUTPUT"

  # ── Tiered Telegram alert ────────────────────────────────────────────────
  # A real alert that cannot be delivered (secrets missing, or Telegram refuses it)
  # WARNS and exits 0: the checks above already ran and their results are in this run,
  # and a red alert job would not reach anyone either. The test_alert path is the
  # opposite: its whole purpose is to prove delivery, so it fails when delivery fails.
  alert:
    needs: [check-runners, check-disk, check-stale-jobs, check-scheduler]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Build and send alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANY_OFFLINE: ${{ needs.check-runners.outputs.any_offline }}
          OFFLINE_RUNNERS: ${{ needs.check-runners.outputs.offline_runners }}
          DISK_WARNING: ${{ needs.check-disk.result == 'failure' }}
          STALE_COUNT: ${{ needs.check-stale-jobs.outputs.stale_count }}
          STALE_SUMMARY: ${{ needs.check-stale-jobs.outputs.stale_summary }}
          SCHEDULER_MESSAGE: ${{ needs.check-scheduler.outputs.message }}
        run: |
          # Plain text. The facts are runner names, counts and workflow run names --
          # no host addresses -- so the text is safe to echo into this public log.
          MESSAGE=""
          if [ "$ANY_OFFLINE" = "true" ]; then
            LIST=$(echo "$OFFLINE_RUNNERS" | jq -r 'join(", ")' 2>/dev/null || echo "$OFFLINE_RUNNERS")
            MESSAGE="${MESSAGE}CRITICAL - Runner(s) OFFLINE: ${LIST}\nAuto-restart firing.\n\n"
          fi
          if [ "$DISK_WARNING" = "true" ]; then
            MESSAGE="${MESSAGE}WARNING - Disk over threshold (or SSH unreachable, or host key mismatch) on a fleet host - see the check-disk legs of this run\n\n"
          fi
          if [ -n "$STALE_COUNT" ] && [ "$STALE_COUNT" != "0" ]; then
            MESSAGE="${MESSAGE}WARNING - ${STALE_COUNT} stale run(s) (>60min):\n${STALE_SUMMARY}\n\n"
          fi
          if [ -n "$SCHEDULER_MESSAGE" ]; then
            MESSAGE="${MESSAGE}${SCHEDULER_MESSAGE}\n\n"
          fi

          if [ "$TEST_ALERT" = "true" ]; then
            rc=0
            printf '[test] Runner Health Monitor alert path OK\n%s\n' "$RUN_URL" \
              | bash ops/notify-telegram.sh || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::test_alert: Telegram did not accept the test message (exit ${rc})"
              TEST_FAILED=1
            fi
          fi

          if [ -z "$MESSAGE" ]; then
            echo "All checks passed - fleet healthy."
          else
            FULL="Runner Health Monitor\n\n${MESSAGE}${RUN_URL}"
            printf '%b\n' "$FULL"
            printf '%b\n' "$FULL" | bash ops/notify-telegram.sh || true   # warns on its own
          fi
          exit "${TEST_FAILED:-0}"

  # ── Auto-restart each offline runner by its systemd unit ─────────────────
  auto-restart:
    needs: check-runners
    if: always() && needs.check-runners.outputs.any_offline == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.check-runners.outputs.offline_detail) }}
    uses: ./.github/workflows/runner-restart.yml
    with:
      runner_name: ${{ matrix.runner.name }}
      systemd_unit: ${{ matrix.runner.unit }}
      ssh_secret_prefix: ${{ matrix.runner.prefix }}
      runners_api: ${{ matrix.runner.api }}
    secrets: inherit
