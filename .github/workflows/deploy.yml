name: Reusable Deploy

# Reusable deploy workflow — any project calls this with `uses:` to ship to its VPS.
# Generalized from Weapons_Lore deploy-production.yml: app dir, container/service
# names, health endpoint, compose path, and DB-backup are inputs; the Jira-promote job
# is dropped. Runs on the calling project's own self-hosted runner by default.
#
# Caller example (project/.github/workflows/deploy.yml):
#   jobs:
#     deploy:
#       uses: <you>/action-servers/.github/workflows/deploy.yml@v1
#       with:
#         app_dir: /opt/MyApp
#         app_container: myapp_app
#         proxy_container: myapp_nginx
#         health_path: /api/health
#       secrets: inherit      # VPS_SSH_KEY, VPS_HOST, VPS_USERNAME, VPS_HOST_KEY, ...
#
# Notifications: Telegram (Hermes's bot, via ops/notify-telegram.sh, sendMessage only)
# when both TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID reach this workflow; otherwise the
# notify job skips with a notice. SLACK_WEBHOOK_URL is still accepted so callers that
# pass it explicitly keep working, but it is ignored (OPS-35).
#
# Host key (OPS-38): pass the VPS's public host key as the VPS_HOST_KEY secret or the
# vps_host_key input (known_hosts lines, `<type> <base64>`; see deploy/host-key.sh).
# Every ssh/rsync in the deploy job then verifies it with StrictHostKeyChecking=yes,
# and a connect-only preflight runs before anything else touches the host, so a key
# mismatch fails the job with HOST KEY VERIFICATION FAILED before any remote command.
# Without a pin the old trust-on-first-use behaviour stays, with a ::warning:: on every
# run. The helper is fetched from this repo at job.workflow_sha (the caller's checkout
# doesn't have it), like the notifier below.

on:
  workflow_call:
    inputs:
      runs_on:        { type: string, default: 'self-hosted' }
      app_dir:        { type: string, required: true }      # e.g. /opt/MyApp
      compose_path:   { type: string, default: 'docker-compose.yml' }
      compose_service: { type: string, default: 'app' }       # service rebuilt/recreated
      proxy_service:  { type: string, default: '' }          # e.g. nginx; empty = none
      app_container:  { type: string, required: true }       # container name to verify
      proxy_container: { type: string, default: '' }          # container name to verify (optional)
      health_path:    { type: string, default: '/api/health' }
      health_ok:      { type: string, default: '"status":"ok"' }
      db_remote_file: { type: string, default: '' }          # relative to app_dir; '' = skip backup
      db_backup_dir:  { type: string, default: 'backups' }
      db_retain_days: { type: number, default: 30 }
      ref:            { type: string, default: '' }          # checkout ref; '' = triggering ref
      vps_host_key:   { type: string, default: '' }          # host key pin (or the VPS_HOST_KEY secret); '' = unverified
    secrets:
      VPS_SSH_KEY:       { required: true }
      VPS_HOST:          { required: true }
      VPS_USERNAME:      { required: true }
      VPS_HOST_KEY:      { required: false }                 # known_hosts line(s) for VPS_HOST; unset = unverified (warns)
      PRODUCTION_URL:    { required: false }                 # health-check base URL
      DEPLOY_ENV_JSON:   { required: false }                 # JSON object -> .env on first deploy
      TELEGRAM_BOT_TOKEN: { required: false }                # deploy notification (with chat id)
      TELEGRAM_CHAT_ID:  { required: false }
      SLACK_WEBHOOK_URL: { required: false }                 # DEPRECATED, ignored; kept so explicit callers don't break

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.app_dir }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # deploy/host-key.sh, from this repo at the commit of this workflow file (see the
      # notify job's checkout). Not continue-on-error: no helper, no deploy. Excluded
      # from the rsync below.
      - name: Fetch host-key helper
        uses: actions/checkout@v5
        with:
          repository: Echo8Lore/action-servers
          ref: ${{ job.workflow_sha }}
          sparse-checkout: deploy
          path: .action-servers
          persist-credentials: false

      # Replaces the old `ssh-keyscan -H >> ~/.ssh/known_hosts`. The known_hosts file is
      # per run ($RUNNER_TEMP), so a self-hosted runner's ~/.ssh is never touched. The
      # connect-only `true` is the first thing that reaches the host: a wrong key fails
      # here, before auth, so no command ever runs.
      - name: Verify VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          KEY_SECRET: ${{ secrets.VPS_HOST_KEY }}
          KEY_INPUT: ${{ inputs.vps_host_key }}
        run: |
          set -euo pipefail
          if [ -n "$KEY_SECRET" ] && [ -n "$KEY_INPUT" ]; then
            echo "::error::Both the VPS_HOST_KEY secret and the vps_host_key input are set; pass one."; exit 1
          fi
          # shellcheck disable=SC2034  # read by host-key.sh
          VPS_HOST_KEY="${KEY_SECRET:-$KEY_INPUT}"
          HELPER="$GITHUB_WORKSPACE/.action-servers/deploy/host-key.sh"
          KH="$RUNNER_TEMP/deploy_known_hosts"
          # shellcheck source=/dev/null
          source "$HELPER"
          deploy_host_key_setup "$KH"
          {
            echo "DEPLOY_HOST_KEY_SH=$HELPER"
            echo "DEPLOY_KNOWN_HOSTS=$KH"
            echo "DEPLOY_HOST_PINNED=$DEPLOY_HOST_PINNED"
          } >> "$GITHUB_ENV"
          deploy_ssh_opts "$KH" "$DEPLOY_HOST_PINNED"
          rc=0
          ssh -n "${DEPLOY_SSH_OPTS[@]}" -o BatchMode=yes -o ConnectTimeout=20 \
            "${VPS_USERNAME}@${VPS_HOST}" true 2> "$RUNNER_TEMP/ssh.err" || rc=$?
          krc=0
          deploy_ssh_check "$rc" "$RUNNER_TEMP/ssh.err" || krc=$?
          [ "$krc" -eq 2 ] && exit 1
          if [ "$rc" -ne 0 ]; then
            # Not a host-key failure: show ssh's reason, address redacted (Actions masks
            # the secret anyway; this also covers a hostname ssh echoes back).
            ERR=$(cat "$RUNNER_TEMP/ssh.err")
            echo "::error::SSH to the deploy target failed (exit ${rc}) before deploying:"
            printf '%s\n' "${ERR//"$VPS_HOST"/<VPS_HOST>}"
            exit 1
          fi
          echo "SSH to the deploy target OK (host key $([ "$DEPLOY_HOST_PINNED" = true ] && echo pinned || echo NOT verified))."

      - name: Docker cache cleanup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          # shellcheck source=/dev/null
          source "$DEPLOY_HOST_KEY_SH"; deploy_ssh_opts "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_HOST_PINNED"
          T=${VPS_USERNAME}@${VPS_HOST}
          ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "sudo docker builder prune --keep-storage 5368709120 -f" 2>/dev/null || true
          ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "sudo docker image prune -a --filter 'until=168h' -f" 2>/dev/null || true

      - name: Pre-deploy DB backup
        if: inputs.db_remote_file != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          # shellcheck source=/dev/null
          source "$DEPLOY_HOST_KEY_SH"; deploy_ssh_opts "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_HOST_PINNED"
          T=${VPS_USERNAME}@${VPS_HOST}
          ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "
            DB='${{ inputs.app_dir }}/${{ inputs.db_remote_file }}'
            BK='${{ inputs.app_dir }}/${{ inputs.db_backup_dir }}'
            if [ -f \"\$DB\" ]; then
              mkdir -p \"\$BK\"; STAMP=\$(date +%Y%m%d_%H%M%S)
              if command -v sqlite3 &>/dev/null; then sqlite3 \"\$DB\" \".backup '\$BK/backup_\${STAMP}.db'\";
              else cp \"\$DB\" \"\$BK/backup_\${STAMP}.db\"; fi
              find \"\$BK\" -name 'backup_*.db' -mtime +${{ inputs.db_retain_days }} -delete 2>/dev/null || true
              echo 'Backup created.'
            else echo 'No existing DB — first deploy.'; fi
          "

      - name: Deploy to VPS (near-zero-downtime)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          DEPLOY_ENV_JSON: ${{ secrets.DEPLOY_ENV_JSON }}
        run: |
          set -e
          APP_DIR='${{ inputs.app_dir }}'
          SVC='${{ inputs.compose_service }}'
          PROXY_SVC='${{ inputs.proxy_service }}'
          APP_C='${{ inputs.app_container }}'
          DB_REL='${{ inputs.db_remote_file }}'
          # shellcheck source=/dev/null
          source "$DEPLOY_HOST_KEY_SH"; deploy_ssh_opts "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_HOST_PINNED"
          T=${VPS_USERNAME}@${VPS_HOST}
          TEMP=/home/${VPS_USERNAME}/app_temp

          ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "mkdir -p ${TEMP}"
          # Sync working tree (exclude heavy/local artifacts and the live DB).
          # An array, not a string: an unquoted string expansion would pass '*.db' to
          # rsync with the quotes intact, so *.db would not be excluded (OPS-39).
          EXCLUDES=(--exclude node_modules --exclude .git --exclude '*.db' --exclude _qa --exclude test-results --exclude playwright-report --exclude .action-servers)
          # Same pinned options for rsync's ssh; rsync splits -e on spaces but honours
          # single quotes (a runner path may contain spaces).
          RSH="ssh$(printf " '%s'" "${DEPLOY_SSH_OPTS[@]}")"
          rsync -avz --delete -e "$RSH" "${EXCLUDES[@]}" ./ "${T}:${TEMP}/"

          # Build the remote deploy script. DB file (if any) is preserved in place.
          DB_EXCLUDE=""
          [ -n "$DB_REL" ] && DB_EXCLUDE="--exclude '${DB_REL}'"
          ENV_WRITE=""
          if [ -n "${DEPLOY_ENV_JSON:-}" ]; then
            # Write .env from JSON only if it doesn't already exist on the host.
            ENV_KV=$(printf '%s' "$DEPLOY_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
            # printf keeps every line indented so the YAML block scalar stays valid.
            ENV_WRITE=$(printf "if [ ! -f .env ]; then cat > .env <<'DOTENV'\n%s\nDOTENV\nchmod 600 .env; fi" "$ENV_KV")
          fi

          ssh "${DEPLOY_SSH_OPTS[@]}" "$T" bash -s <<REMOTE
          set -e
          sudo rsync -av ${DB_EXCLUDE} ${TEMP}/ ${APP_DIR}/
          sudo chown -R ${VPS_USERNAME}:${VPS_USERNAME} ${APP_DIR}
          cd ${APP_DIR}
          ${ENV_WRITE}
          sudo docker tag ${APP_C}:latest ${APP_C}:rollback 2>/dev/null || true
          sudo docker compose -f '${{ inputs.compose_path }}' build ${SVC}
          if [ -n "${PROXY_SVC}" ]; then sudo docker compose -f '${{ inputs.compose_path }}' up -d ${PROXY_SVC}; fi
          sudo docker compose -f '${{ inputs.compose_path }}' up -d --no-deps --force-recreate ${SVC}
          rm -rf ${TEMP}
          REMOTE

      - name: Verify containers running
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          # shellcheck source=/dev/null
          source "$DEPLOY_HOST_KEY_SH"; deploy_ssh_opts "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_HOST_PINNED"
          T=${VPS_USERNAME}@${VPS_HOST}
          sleep 10
          app=$(ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "docker ps -q -f name=${{ inputs.app_container }} -f status=running")
          if [ -z "$app" ]; then
            echo "::error::App container '${{ inputs.app_container }}' not running."
            ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "docker ps -a"; exit 1
          fi
          if [ -n "${{ inputs.proxy_container }}" ]; then
            proxy=$(ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "docker ps -q -f name=${{ inputs.proxy_container }} -f status=running")
            [ -z "$proxy" ] && { echo "::error::Proxy container not running."; ssh "${DEPLOY_SSH_OPTS[@]}" "$T" "docker ps -a"; exit 1; }
          fi
          echo "Container(s) running."

      - name: Health check
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          BASE="${PRODUCTION_URL:-http://${VPS_HOST}}"
          URL="${BASE%/}${{ inputs.health_path }}"
          if curl -Lsfk --max-time 10 "$URL" | grep -q '${{ inputs.health_ok }}'; then
            echo "Health check passed: $URL"
          else
            echo "::error::Health check failed: $URL"; exit 1
          fi

  notify:
    needs: deploy
    if: always() && (success() || failure())
    runs-on: ubuntu-latest
    steps:
      # Secrets can't be tested in a step `if:`, so map them to env and test there.
      - name: Check Telegram config
        id: cfg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram not configured (TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID not passed) - deploy notification skipped"
          fi

      # The caller's checkout doesn't have ops/, so fetch the notifier from this public
      # repo (same pattern as runner-restart.yml): one sender, one token-hygiene
      # implementation. job.workflow_sha is the commit of the workflow file defining
      # this job, i.e. the action-servers commit the caller resolved (e.g. @v1), so
      # the script matches the workflow. If it is empty at runtime, checkout falls
      # back to the default branch.
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        with:
          repository: Echo8Lore/action-servers
          ref: ${{ job.workflow_sha }}
          sparse-checkout: ops
          path: .action-servers
          persist-credentials: false

      - name: Telegram notify
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ inputs.ref || github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          if [ "$RESULT" = "success" ]; then STATUS="Deploy succeeded"; else STATUS="DEPLOY FAILED"; fi
          if [ ! -f .action-servers/ops/notify-telegram.sh ]; then
            echo "::warning::notify-telegram.sh not available (checkout failed) - deploy notification not sent"
            exit 0
          fi
          printf '%s: %s@%s (%s)\nApp dir: %s\nRun: %s\n' \
            "$STATUS" "$REPO" "${SHA:0:12}" "$REF_NAME" "$APP_DIR" "$RUN_URL" \
            | bash .action-servers/ops/notify-telegram.sh || true
