name: Restart Self-Hosted Runner

# Parameterized restart — targets any runner by its systemd unit name (from
# fleet/inventory.yml) on the fleet host. Generalized from Weapons_Lore
# runner-restart.yml (WEAP-464), which hardcoded a single unit name.
#
# Required secrets (per host, selected by the ssh_secret_prefix input):
#   - <PREFIX>_VPS_HOST, <PREFIX>_VPS_USERNAME, <PREFIX>_VPS_SSH_KEY
#   - RUNNER_HEALTH_PAT (admin scope on the org + personal repos, for the verify step)
#   - TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (optional; outcome notification via
#     ops/notify-telegram.sh, fetched from Echo8Lore/action-servers at job.workflow_sha).
#     Called from runner-health (quiet_unless_online), only "verified online" notifies.
#     Manual dispatches notify every outcome, including a failed restart (OPS-47).
#
# Multi-host: the host is chosen by ssh_secret_prefix (the host's value in
# fleet/inventory.yml), resolved via secrets[format(...)].
#
# Host key (OPS-33): the prefix is mapped to its inventory host id, and ssh verifies
# the key pinned for that id in fleet/known_hosts (fleet/pinned-ssh.sh). A prefix with
# no inventory host, a host with no pinned key, or a different key presented fails the
# job before anything runs on the host. Plain ssh rather than appleboy/ssh-action, for
# the reason given at runner-health.yml's check-disk job. fleet/ is checked out from
# this repo at job.workflow_sha (the commit of this workflow file, whoever calls it),
# so the pins always match the workflow that uses them.

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: 'Runner name (as shown in Settings -> Actions -> Runners)'
        required: true
        type: string
      systemd_unit:
        description: 'systemd unit, e.g. actions.runner.Echo8Lore.org-runner-01.service'
        required: true
        type: string
      ssh_secret_prefix:
        description: 'Host secret prefix from fleet/inventory.yml (DEVOPS = ovh-staging, DEVOPS001 = ovh-devops-001; HOSTING = hosting-vps has no runners)'
        required: false
        default: DEVOPS
        type: string
      runners_api:
        description: 'Runner list API for the verify step, e.g. repos/<owner>/<repo>/actions/runners (default: this org)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      runner_name:
        required: true
        type: string
      systemd_unit:
        required: true
        type: string
      ssh_secret_prefix:
        required: false
        default: DEVOPS
        type: string
      runners_api:
        required: false
        default: ''
        type: string
      # runner-health.yml sets this: its own (deduplicated) CRITICAL already covers a
      # runner that stays offline, so the restart only notifies a verified recovery.
      # Manual dispatches don't have the input and keep the "NOT confirmed" notice.
      quiet_unless_online:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  restart-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Echo8Lore/action-servers
          ref: ${{ job.workflow_sha }}
          sparse-checkout: fleet
          path: .action-servers
          persist-credentials: false

      - name: Restart runner service via SSH
        id: restart
        env:
          UNIT: ${{ inputs.systemd_unit }}
          PREFIX: ${{ inputs.ssh_secret_prefix }}
          SSH_HOST: ${{ secrets[format('{0}_VPS_HOST', inputs.ssh_secret_prefix)] }}
          SSH_USER: ${{ secrets[format('{0}_VPS_USERNAME', inputs.ssh_secret_prefix)] }}
          SSH_KEY: ${{ secrets[format('{0}_VPS_SSH_KEY', inputs.ssh_secret_prefix)] }}
        run: |
          set -euo pipefail
          FLEET=.action-servers/fleet
          # The unit name goes into the remote command line: accept unit names only.
          if ! [[ "$UNIT" =~ ^[A-Za-z0-9@._:-]+\.service$ ]]; then
            echo "::error::systemd_unit is not a plain .service unit name"; exit 1
          fi
          HOST_ID=$(PREFIX="$PREFIX" yq -r '[.hosts[] | select(.ssh_secret_prefix == strenv(PREFIX)) | .id] | .[]' "$FLEET/inventory.yml")
          if [ -z "$HOST_ID" ] || [ "$(printf '%s\n' "$HOST_ID" | wc -l)" -ne 1 ]; then
            echo "::error::ssh_secret_prefix '${PREFIX}' matches no single host in fleet/inventory.yml"; exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::${HOST_ID}: ${PREFIX}_VPS_* secrets not configured"; exit 1
          fi
          echo "Host: ${HOST_ID} (prefix ${PREFIX})"
          source "$FLEET/pinned-ssh.sh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          pinned_ssh_opts "$HOST_ID" "$RUNNER_TEMP/key"
          # Remote stderr is folded into stdout (2>&1 runs on the host), so the local
          # ssh.err only holds ssh's own messages. UNIT expands here on purpose
          # (validated above).
          rc=0
          # shellcheck disable=SC2029
          ssh "${PINNED_SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "UNIT='${UNIT}' bash -s 2>&1" \
            2> "$RUNNER_TEMP/ssh.err" <<'REMOTE' || rc=$?
          # One function, read whole before it runs: nothing below can eat the rest of
          # the script from stdin (bash -s), and sudo gets /dev/null, not the script.
          restart() {
            echo "=== Runner service status (before) ==="
            sudo systemctl status "$UNIT" --no-pager || true

            echo ""
            echo "=== Restarting $UNIT ==="
            # KillMode=process can orphan Runner.Listener children on restart.
            # Kill the whole cgroup, then start fresh.
            sudo systemctl kill --kill-who=all --signal=SIGTERM "$UNIT" || true
            sleep 2
            # Hosts run several runners: only kill this unit's leftover listener,
            # matched by its install dir. Bracket class [R] prevents pkill -f from
            # matching its own cmdline.
            DIR=$(systemctl show -p WorkingDirectory --value "$UNIT")
            case "$DIR" in
              /?*) sudo pkill -9 -f "${DIR}/bin/[R]unner.Listener" 2>/dev/null || true ;;
              *)   echo "WARN: no WorkingDirectory for $UNIT; skipping orphan sweep" ;;
            esac
            sudo systemctl start "$UNIT"

            echo ""
            echo "=== Runner service status (after) ==="
            sleep 5
            sudo systemctl status "$UNIT" --no-pager
          }
          restart </dev/null
          REMOTE
          krc=0
          pinned_ssh_check "$HOST_ID" "$rc" "$RUNNER_TEMP/ssh.err" || krc=$?
          [ "$krc" -eq 2 ] && exit 1
          if [ "$rc" -ne 0 ]; then
            echo "::error::${HOST_ID}: restart over SSH failed (exit ${rc})"; exit 1
          fi

      - name: Verify runner is online
        # always(): even a failed restart command can leave the runner online (the
        # remote script may have run partway, or the runner was never down). This
        # step is the ground truth; the notification (OPS-47) reports both facts.
        if: always()
        id: verify
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
          # Not RUNNER_NAME: the job's own runner sets that variable and it wins.
          TARGET_RUNNER: ${{ inputs.runner_name }}
          RUNNERS_API: ${{ inputs.runners_api || format('orgs/{0}/actions/runners', github.repository_owner) }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No RUNNER_HEALTH_PAT — cannot verify; restart command was sent."
            exit 0
          fi
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(gh api --paginate "$RUNNERS_API" \
              --jq ".runners[] | select(.name == \"$TARGET_RUNNER\") | .status" 2>/dev/null || true)
            if [ "$STATUS" = "online" ]; then
              echo "Runner $TARGET_RUNNER is back online."
              echo "online=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: $TARGET_RUNNER status '${STATUS:-unknown}'. Retrying in 10s..."
            sleep 10
          done
          echo "::warning::Runner $TARGET_RUNNER not confirmed online after restart (may still be recovering)."

      - uses: actions/checkout@v5
        if: always()
        continue-on-error: true
        with:
          # Public repo, fixed location: works whichever repo calls this workflow. Same
          # commit as the fleet/ checkout above (OPS-38), not main.
          repository: Echo8Lore/action-servers
          ref: ${{ job.workflow_sha }}
          sparse-checkout: ops
          persist-credentials: false

      # Runs on every outcome (OPS-47): a restart whose SSH step fails must still
      # page a manual dispatch. Only claims "verified online" when the verify step
      # actually saw it online; a failed restart command is never reported as one.
      - name: Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_RUNNER: ${{ inputs.runner_name }}
          ONLINE: ${{ steps.verify.outputs.online }}
          QUIET: ${{ inputs.quiet_unless_online }}
          RESTART: ${{ steps.restart.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ONLINE" != "true" ] && [ "$QUIET" = "true" ]; then
            echo "Not confirmed online; no notice (runner-health's alert covers it)."
            exit 0
          fi
          if [ "$ONLINE" = "true" ]; then
            if [ "$RESTART" = "failure" ]; then
              MSG="Self-hosted runner ${TARGET_RUNNER}: restart command FAILED, but the runner is verified ONLINE."
            else
              MSG="Self-hosted runner ${TARGET_RUNNER} restarted and verified online."
            fi
          else
            if [ "$RESTART" = "failure" ]; then
              MSG="Self-hosted runner ${TARGET_RUNNER}: restart command FAILED and the runner is NOT online."
            else
              MSG="Self-hosted runner ${TARGET_RUNNER} restart sent, but it was NOT confirmed online."
            fi
          fi
          printf '%s\n%s\n' "$MSG" "$RUN_URL" | bash ops/notify-telegram.sh || true
