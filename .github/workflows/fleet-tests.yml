name: Fleet Tests

# Unit tests for the fleet tooling. fleet/: the inventory report never carries
# IPs/ports/images/server_names, drift classification, degraded input never breaking
# the report, the pinned-host-key SSH options and fleet/known_hosts itself (one pin per
# inventory host, keyed by id, no addresses). ops/: the queue watchdog's classification,
# dedupe and public-log hygiene.
# Stdlib only; no secrets, no network.
# Hosted runner: this repo is public, so hosted minutes are free.

on:
  push:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'ops/**'
      - '.github/workflows/fleet-tests.yml'
  pull_request:
    paths:
      - 'fleet/**'
      - 'ops/**'
      - '.github/workflows/fleet-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run fleet tests
        run: python3 -m unittest discover -s fleet -v
      - name: Run ops tests
        run: python3 -m unittest discover -s ops -v
