name: Fleet Tests

# Unit tests for the fleet tooling. fleet/: the inventory report never carries
# IPs/ports/images/server_names, drift classification, degraded input never breaking
# the report, the pinned-host-key SSH options (against a real loopback sshd too, with a
# space in the path), every fleet workflow's ssh using them, and fleet/known_hosts
# itself (one pin per inventory host, keyed by id, no addresses). ops/: the queue watchdog's classification,
# dedupe and public-log hygiene; fleet-dispatch.sh (token off argv, allowlist, retry
# policy, exit codes; curl stubbed), its systemd units and installer --check, and the
# dispatch-timer liveness check; runner-health's alert dedupe and its wiring. deploy/: host-key pinning for the deploy path (pin
# parsing, ssh options, the preflight, every deploy ssh/rsync using them), deploy.yml's
# rsync excludes, and no public IP address in any tracked file. runners/: bootstrap's
# needrestart drop-in (OPS-49: written before any apt-get, idempotent, verified, and
# evaluated like needrestart does, runner units skipped and nothing else).
# Stdlib only; no secrets, no network.
# Hosted runner: this repo is public, so hosted minutes are free.

on:
  # No paths filter: deploy/test_deploy_yml.py scans every tracked file for public IP
  # addresses, so a change anywhere (docs, README, any workflow) must run it. The
  # suites take a few seconds on a free hosted runner.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run fleet tests
        run: python3 -m unittest discover -s fleet -v
      - name: Run ops tests
        run: python3 -m unittest discover -s ops -v
      - name: Run deploy tests
        run: python3 -m unittest discover -s deploy -v
      - name: Run runners tests
        run: python3 -m unittest discover -s runners -v
