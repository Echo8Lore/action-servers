name: Fleet Inventory

# Polls every host in fleet/inventory.yml over SSH (READ-ONLY; fleet/collect-facts.sh)
# and reports what is actually there: hostname, OS, uptime, disk /, memory, runner
# systemd units, nginx / docker / listening-port presence, and which host each
# configured domain's DNS records point at. Host facts are polled, not remembered.
#
# WHAT IS PUBLISHED, AND WHY. This repo is public: job logs, the step summary and
# artifacts are all readable by any logged-in GitHub user. Host addresses are kept in
# secrets by design (fleet/inventory.yml carries "no IPs"), so nothing that reveals one
# is published:
#   - Every discovered IP is ::add-mask::ed before anything is printed, and the raw
#     collector output is never printed.
#   - The public report (artifact + summary) carries host-id <-> domain matches,
#     counts, runner units and drift. It does NOT carry IP addresses, listening ports,
#     container names/images or nginx server_name lists: together those are a recon map
#     of the fleet, and none of them are needed for the drift / domain questions.
#   - The FULL facts (including those fields) are kept only GPG-encrypted, and only if
#     the repo variable FLEET_REPORT_GPG_PUBKEY holds an ASCII-armored public key.
#     Decrypt with: gpg -d fleet-full-<host>.json.gpg
#
# Hosts: every entry in fleet/inventory.yml `hosts[]`. SSH secrets are selected by the
# host's ssh_secret_prefix (<PREFIX>_VPS_HOST / _VPS_USERNAME / _VPS_SSH_KEY). A host
# whose secrets are not set is reported "not_configured", not failed -- so adding a host
# is an inventory entry, and its secrets can follow.
#
# Domains: fleet/inventory.yml `domains[]`.
#
# Plain `ssh` rather than appleboy/ssh-action (used by runner-health.yml): that action
# streams the remote output into the public log, and the output here contains IPs.
#
# HOST KEYS ARE NOT VERIFIED. Each run starts with an empty known_hosts
# (StrictHostKeyChecking=accept-new against a per-run file), so whatever key the
# server presents is accepted: this is zero host-key verification, not trust-on-first-
# use. Acceptable for a read-only poll -- a man-in-the-middle could feed this report
# false facts, but the collector writes nothing and sends nothing beyond the SSH
# session itself. Pinning host keys (e.g. a <PREFIX>_VPS_HOST_KEY secret) is a
# follow-up.

on:
  schedule:
    - cron: '23 5 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      hosts: ${{ steps.inv.outputs.hosts }}
      domains: ${{ steps.inv.outputs.domains }}
    steps:
      - uses: actions/checkout@v5
      - name: Read hosts + domains
        id: inv
        run: |
          echo "hosts=$(yq -o=json -I=0 '.hosts' fleet/inventory.yml)" >> "$GITHUB_OUTPUT"
          echo "domains=$(yq -r '.domains // [] | join(",")' fleet/inventory.yml)" >> "$GITHUB_OUTPUT"

  collect:
    needs: load-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.load-inventory.outputs.hosts) }}
    name: collect (${{ matrix.host.id }})
    steps:
      - uses: actions/checkout@v5

      - name: Collect facts from ${{ matrix.host.id }}
        env:
          HOST_ID: ${{ matrix.host.id }}
          PREFIX: ${{ matrix.host.ssh_secret_prefix }}
          SSH_HOST: ${{ secrets[format('{0}_VPS_HOST', matrix.host.ssh_secret_prefix)] }}
          SSH_USER: ${{ secrets[format('{0}_VPS_USERNAME', matrix.host.ssh_secret_prefix)] }}
          SSH_KEY: ${{ secrets[format('{0}_VPS_SSH_KEY', matrix.host.ssh_secret_prefix)] }}
          DOMAINS: ${{ needs.load-inventory.outputs.domains }}
          GPG_PUBKEY: ${{ vars.FLEET_REPORT_GPG_PUBKEY }}
        run: bash fleet/collect-host.sh

      # always(): out/ only ever holds the public JSON and the encrypted file (the
      # raw collector output lives in a temp dir that is deleted on exit).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-host-${{ matrix.host.id }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  report:
    needs: [load-inventory, collect]
    if: always() && needs.load-inventory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: fleet-host-*
          path: hosts
          merge-multiple: true

      - name: Build report + drift check
        run: |
          set -euo pipefail
          mkdir -p report hosts
          yq -o=json '.' fleet/inventory.yml > "$RUNNER_TEMP/inventory.json"
          python3 fleet/fleet_facts.py report "$RUNNER_TEMP/inventory.json" hosts \
            --json-out report/fleet-report.json --md-out report/summary.md
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
          # Encrypted full reports, if any, travel with the public one.
          cp hosts/*.json.gpg report/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-inventory-report
          path: report/
          if-no-files-found: error
          retention-days: 30
